[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gander-runtime"
version = "1.0.0"
description = "Realtime Gander runtime with native task tools and pluggable workers."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "mcpmft>=1.0.0",
  "pillow>=10",
  "pyyaml>=6",
  "uvicorn[standard]>=0.29",
  "websockets>=12",
]

[project.optional-dependencies]
# Lifecycle tests stub the Thinker and the worker gateway, so they run without
# torch or a model: `pip install -e ./gander_runtime[test] && pytest gander_runtime/tests`
test = [
  "pytest>=8",
  "httpx>=0.27",
  "pillow>=10",
]

[project.scripts]
gander-serve = "gander_runtime.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gander_runtime*"]
